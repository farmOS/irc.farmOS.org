---
- name: Provision irc.farmOS.org
  hosts: irc.farmos.org
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_user: root
  vars_files:
    - vars.yml
  become: true
  tasks:

    - name: Set the server hostname.
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Install packages.
      apt:
        package:
          - fail2ban
          - git
          - ufw
          - unattended-upgrades
          - vim
        state: present
        update_cache: yes

    - name: Adjust APT update intervals.
      copy:
        src: apt.conf.d/10periodic
        dest: /etc/apt/apt.conf.d/10periodic
        mode: "0444"

    - name: Enable UFW and block all incoming traffic.
      ufw:
        state: enabled
        direction: incoming
        policy: deny
      notify: Reload UFW

    - name: Allow SSH traffic.
      ufw:
        rule: allow
        port: "22"
        proto: tcp
      notify: Reload UFW

    - name: Allow HTTP traffic.
      ufw:
        rule: allow
        port: "80"
        proto: tcp
      notify: Reload UFW

    - name: Allow HTTPS traffic.
      ufw:
        rule: allow
        port: "443"
        proto: tcp
      notify: Reload UFW

    - name: Block ping requests.
      replace:
        path: /etc/ufw/before.rules
        regexp: '(^-A ufw-before-input -p icmp --icmp-type\s.*\s)(ACCEPT)$'
        replace: '\1DROP'
        backup: yes
      notify: Reload UFW

    - name: Disallow SSH password authentication.
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: Restart SSH

    - name: Remove "PermitRootLogin yes" from /etc/ssh/sshd_config
      lineinfile:
        dest: /etc/ssh/sshd_config
        regexp: "^PermitRootLogin"
        state: absent
      notify: Restart SSH

    - name: Install Docker dependencies.
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes

    - name: Create directory for APT keyrings.
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get DEB architecture
      shell: dpkg --print-architecture
      register: deb_architecture
      changed_when: false

    - name: Add Docker repository.
      apt_repository:
        repo: "deb [arch={{ deb_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        state: present
        update_cache: true

    - name: Install Docker.
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Install Docker python package.
      apt:
        name: python3-docker
        state: present

    - name: Create a public network for Docker services.
      docker_network:
        name: public
        ipam_config:
          - subnet: 172.20.0.0/16
            gateway: 172.20.0.1

    - name: Create a private network for Docker services.
      docker_network:
        name: private
        internal: yes
        ipam_config:
          - subnet: 172.21.0.0/16
            gateway: 172.21.0.1

    - name: Clone the irc.farmOS.org repository.
      git:
        repo: https://github.com/farmOS/irc.farmOS.org.git
        dest: /opt/irc.farmOS.org
        version: main
        update: yes

    - name: Ensure the WeeChat variables are set.
      assert:
        that:
          - item is defined
          - item | length > 0
        fail_msg: Set {{ item }} in ansible/vars.yml (see ansible/vars.yml.example).
        quiet: true
      loop:
        - irc_addresses
        - irc_nicks
        - irc_password
        - irc_autojoin

    - name: Create config and logs directories.
      file:
        path: /opt/irc.farmOS.org/{{ item }}
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - config/nginx
        - config/weechat
        - logs

    - name: Deploy WeeChat configuration.
      template:
        src: weechat/{{ item }}.conf.j2
        dest: /opt/irc.farmOS.org/config/weechat/{{ item }}.conf
        owner: "1000"
        group: "1000"
        mode: "0600"
      loop:
        - irc
        - logger

    - name: Build the ircj-watch image.
      docker_image:
        name: ircj-watch
        source: build
        build:
          path: /opt/irc.farmOS.org/services/ircjournal
          target: ircj-watch

    - name: Build the ircj-serve image.
      docker_image:
        name: ircj-serve
        source: build
        build:
          path: /opt/irc.farmOS.org/services/ircjournal
          target: ircj-serve

    - name: Start the PostgreSQL database container.
      docker_container:
        name: db
        image: postgres:18
        env:
          POSTGRES_USER: ircj
          POSTGRES_PASSWORD: ircj
          POSTGRES_DB: ircj
        volumes:
          - /opt/irc.farmOS.org/db:/var/lib/postgresql
        networks:
          - name: private
            ipv4_address: 172.21.0.2
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ircj -d ircj"]
          interval: 5s
          timeout: 5s
          retries: 10
        restart: yes
        restart_policy: unless-stopped

    - name: Start the WeeChat container.
      docker_container:
        name: weechat
        image: weechat/weechat:4-slim
        command: weechat-headless --stdout
        env:
          TZ: UTC
        volumes:
          - /opt/irc.farmOS.org/config/weechat:/home/user/.config/weechat
          - /opt/irc.farmOS.org/logs:/logs
        networks:
          - name: public
            ipv4_address: 172.20.0.2
        restart: yes
        restart_policy: unless-stopped

    - name: Start the ircj-watch container.
      docker_container:
        name: ircj-watch
        image: ircj-watch
        command: ircj-watch
        env:
          IRCJ_DB: postgres://ircj:ircj@db:5432/ircj
        volumes:
          - /opt/irc.farmOS.org/logs:/logs:ro
        networks:
          - name: private
            ipv4_address: 172.21.0.3
        restart: yes
        restart_policy: unless-stopped

    - name: Start the ircj-serve container.
      docker_container:
        name: ircj-serve
        image: ircj-serve
        command: ircj-serve
        env:
          IRCJ_DB: postgres://ircj:ircj@db:5432/ircj
          ROCKET_ADDRESS: 0.0.0.0
        networks:
          - name: public
            ipv4_address: 172.20.0.4
          - name: private
            ipv4_address: 172.21.0.4
        restart: yes
        restart_policy: unless-stopped

    - name: Create directory for TLS certificates.
      file:
        path: /opt/irc.farmOS.org/certs
        state: directory
        mode: "0700"

    - name: Create self-signed certificates.
      shell:
        cmd: "openssl req -x509 -newkey rsa:4096 -nodes -keyout /opt/irc.farmOS.org/certs/irc.farmos.org.key -out /opt/irc.farmOS.org/certs/irc.farmos.org.chain.crt -subj '/CN=irc.farmos.org' -addext 'subjectAltName=DNS:irc.farmos.org'"
        creates: "/opt/irc.farmOS.org/certs/irc.farmos.org.chain.crt"

    - name: Deploy Nginx configuration.
      copy:
        src: nginx.conf
        dest: /opt/irc.farmOS.org/config/nginx/default.conf
        mode: "0700"

    - name: Start the proxy container.
      docker_container:
        name: proxy
        image: nginx
        published_ports:
          - "80:80"
          - "443:443"
        networks:
          - name: public
            ipv4_address: 172.20.0.5
        volumes:
          - /opt/irc.farmOS.org/config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
          - /opt/irc.farmOS.org/certs:/etc/nginx/certs:ro
        restart: yes
        restart_policy: unless-stopped

  handlers:

    - name: Reload UFW
      ufw:
        state: reloaded

    - name: Restart SSH
      service:
        name: ssh
        state: restarted
