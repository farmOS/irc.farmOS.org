services:
  weechat:
    image: weechat/weechat:4-slim
    command: ["weechat-headless", "--stdout"]
    environment:
      TZ: UTC
    volumes:
      - ./config/weechat/:/home/user/.config/weechat
      - ./logs:/logs
    restart: unless-stopped
  db:
    image: postgres:18
    volumes:
      - './db:/var/lib/postgresql'
    environment:
      POSTGRES_USER: ircj
      POSTGRES_PASSWORD: ircj
      POSTGRES_DB: ircj
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ircj -d ircj']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  ircj-watch:
    build: services/ircjournal
    command: ["ircj-watch"]
    environment:
      IRCJ_DB: postgres://ircj:ircj@db:5432/ircj
    volumes:
      - ./logs:/logs:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
